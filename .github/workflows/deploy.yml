name: Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -DskipTests clean package

      - name: Pick jar
        run: |
          JAR=$(ls -1 target/*.jar | grep -v 'original-' | head -n 1)
          echo "JAR_FILE=$JAR" >> $GITHUB_ENV
          echo "Using $JAR"

      # 🔐 ВОТ КЛЮЧЕВОЙ ШАГ — НОРМАЛЬНЫЙ SSH-АГЕНТ
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload jar to server
        run: |
          rsync -avz --progress \
            "$JAR_FILE" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/task-reminder-bot/

      - name: Restart service
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo systemctl restart task-reminder-bot && sudo systemctl status task-reminder-bot --no-pager"
