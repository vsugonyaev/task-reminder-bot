name: Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -DskipTests clean package

      - name: Pick jar (not original-*)
        run: |
          echo "Artifacts:"
          ls -lh target/*.jar
          JAR=$(ls -1 target/*.jar | grep -v 'original-' | head -n 1)
          echo "JAR_FILE=$JAR" >> $GITHUB_ENV
          echo "Using jar: $JAR"

      - name: Encode jar as base64
        run: |
          base64 "${{ env.JAR_FILE }}" > app.jar.base64
          ls -lh app.jar.base64

      - name: Deploy via SSH (base64, no scp)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            echo "Receiving jar..."
            cat > /tmp/app.jar.base64

            echo "Installing jar..."
            base64 -d /tmp/app.jar.base64 > /opt/task-reminder-bot/app.jar
            rm -f /tmp/app.jar.base64

            chmod 644 /opt/task-reminder-bot/app.jar

            sudo systemctl restart task-reminder-bot
            sudo systemctl status task-reminder-bot --no-pager
          input: |
            $(cat app.jar.base64)
