name: Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -DskipTests clean package

      - name: Pick jar
        shell: bash
        run: |
          set -euo pipefail
          echo "Artifacts:"
          ls -lh target/*.jar
          JAR=$(ls -1 target/*.jar | grep -v 'original-' | head -n 1)
          echo "JAR_FILE=$JAR" >> $GITHUB_ENV
          echo "Using $JAR"

      - name: Prepare SSH key (debug)
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          echo -n "B64 chars: "
          printf '%s' "${{ secrets.SERVER_SSH_KEY_B64 }}" | wc -c

          # Decode secret -> key file
          printf '%s' "${{ secrets.SERVER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          echo "Key file bytes: $(wc -c < ~/.ssh/id_ed25519)"
          echo -n "Key file magic (first 32 bytes): "
          head -c 32 ~/.ssh/id_ed25519 | xxd

          # Validate that OpenSSH can read the key (will fail with libcrypto if corrupted)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          echo "Private key OK"

          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar (scp)
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.SERVER_PORT }}" \
            "$JAR_FILE" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/app.jar"

      - name: Install & restart
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo mkdir -p /opt/task-reminder-bot && \
             sudo mv /tmp/app.jar /opt/task-reminder-bot/app.jar && \
             sudo chmod 644 /opt/task-reminder-bot/app.jar && \
             sudo systemctl restart task-reminder-bot && \
             sudo systemctl status task-reminder-bot --no-pager"
