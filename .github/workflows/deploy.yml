name: Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -DskipTests clean package

      - name: Pick jar
        run: |
          JAR=$(ls -1 target/*.jar | grep -v 'original-' | head -n 1)
          echo "JAR_FILE=$JAR" >> $GITHUB_ENV
          echo "Using $JAR"

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar (scp)
        run: |
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.SERVER_PORT }}" \
            "$JAR_FILE" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/app.jar"

      - name: Install & restart
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo mkdir -p /opt/task-reminder-bot && \
             sudo mv /tmp/app.jar /opt/task-reminder-bot/app.jar && \
             sudo chmod 644 /opt/task-reminder-bot/app.jar && \
             sudo systemctl restart task-reminder-bot && \
             sudo systemctl status task-reminder-bot --no-pager"
