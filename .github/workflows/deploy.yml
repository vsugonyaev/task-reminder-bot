name: Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -DskipTests clean package

      - name: Pick jar (not original-*)
        run: |
          echo "Artifacts:"
          ls -lh target/*.jar
          JAR=$(ls -1 target/*.jar | grep -v 'original-' | head -n 1)
          echo "JAR_FILE=$JAR" >> $GITHUB_ENV
          echo "Using jar: $JAR"

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Connected as:"
            whoami
            echo "On host:"
            hostname
            echo "Listing app dir:"
            ls -la /opt/task-reminder-bot || true

      - name: Upload jar to server (/tmp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "${{ env.JAR_FILE }}"
          target: "/tmp"
          strip_components: 1

      - name: Deploy & restart systemd service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # backup current
            if [ -f /opt/task-reminder-bot/app.jar ]; then
              cp /opt/task-reminder-bot/app.jar /opt/task-reminder-bot/app.jar.bak
            fi

            # install new jar
            mv /tmp/task-reminder-bot-*.jar /opt/task-reminder-bot/app.jar

            # restart service
            sudo systemctl restart task-reminder-bot
            sudo systemctl status task-reminder-bot --no-pager
