# Пример конфигурации task-reminder-bot.
# Скопируйте в config.properties (он в .gitignore) и заполните.
# Путь к файлу можно переопределить переменной окружения CONFIG_FILE.
# Файл читается в UTF-8.

# --- Telegram ---
# Токен от @BotFather. Можно не указывать здесь, а задать переменной окружения TG_BOT_TOKEN (она важнее).
telegram.token=
# Id рабочего чата (узнать: команда /chatid в группе). Переменная окружения TG_CHAT_ID важнее.
# Сюда приходят напоминания; здесь работают команды артефактов.
telegram.chat-id=
# Чаты для тестов через запятую. В них работают все команды, плюс тестовые: /test и /test_cleanup
# (удаляет данные артефактов, созданные в этом чате). У каждого чата свои эпики.
# Рабочий чат указывать нельзя. Пусто — тестовые команды отключены везде.
telegram.test-chat-ids=

# --- Время ---
# Часовой пояс, в котором заданы все времена ниже
timezone=Europe/Moscow
# Напоминание закрыть задачи (рабочие дни спринта, кроме первого)
reminder.time=16:30
# Предупреждение «задачи не закрываем» (первый рабочий день спринта)
sprint-start.time=10:00
# Во сколько откреплять сообщения
unpin.time=23:59

# --- Спринты ---
# Первый день (среда) любого спринта; спринты идут друг за другом
sprint.anchor=2026-10-07
# Длина спринта в днях
sprint.length-days=14

# --- Встречи ---
# Напоминание приходит за remind-before минут до встречи, не закрепляется
# и удаляется из чата через delete-after минут.
# Чтобы отключить встречу, оставьте её room пустым.
meeting.team=СУБО2_1-STRLPL
meeting.remind-before-minutes=5
meeting.delete-after-minutes=5
# Планирование — первый рабочий день спринта
meeting.planning.time=10:00
meeting.planning.room=https://dion.vc/event/mestnikovat
# Дейлик — все рабочие дни, кроме первого и последнего дня спринта
meeting.daily.time=10:00
meeting.daily.room=https://dion.vc/event/mestnikovat
# Обзор спринта — последний рабочий день спринта
meeting.review.time=10:00
meeting.review.room=https://dion.vc/event/ptohov

# --- Артефакты эпиков ---
# Файл базы SQLite (создаётся автоматически). Бэкап — просто копия файла.
artifacts.db-path=artifacts.db
# Типы артефактов через запятую — в этом порядке они показываются в кнопках и в списках
artifacts.types=SA, BA, Макеты, ТПиС, ПТР, ПМИ, ПСИ, ТКР, ТИС, АР, АИС, Тест-план к4
# Допустимые префиксы ключей эпиков (STRLPL-123)
artifacts.epic-key-prefixes=STRLPL, STRLPDML
# Через сколько минут удалять сообщение с результатом (/artifacts, подтверждения)
artifacts.result-delete-minutes=5
# Через сколько минут бездействия отменять незавершённый диалог
artifacts.dialog-timeout-minutes=10

# --- Доступ по тегам участников рабочего чата ---
# Теги через запятую, регистр не важен.
# Владелец и администраторы группы могут всё. Участники без тега — только просмотр.
# Пусто — доступно любому участнику с тегом.
# Смотреть артефакты (/artifacts, /artifacts_archive) могут все.
# Важно: в правах группы запретите участникам менять свой тег, иначе любой выдаст себе доступ.
# Добавлять артефакты и заменять ссылки
access.artifact-edit=SA, BA, Design, IT-Lead, QA, PO
# Удалять ссылки на артефакты
access.artifact-delete=IT-Lead, PO
# Архивировать эпики
access.epic-archive=IT-Lead, PO

# --- Прочее ---
# Кому писать, если задачу закрыли в первый день спринта
scrum-master=@vsugonyaev
# На сколько минут закреплять сообщение по команде /test
test.pin-minutes=5
