# Пример конфигурации task-reminder-bot.
# Скопируйте в config.properties (он в .gitignore) и заполните.
# Путь к файлу можно переопределить переменной окружения CONFIG_FILE.
# Файл читается в UTF-8.

# --- Telegram ---
# Токен от @BotFather. Можно не указывать здесь, а задать переменной окружения TG_BOT_TOKEN (она важнее).
telegram.token=
# Id рабочего чата (узнать: команда /chatid в группе). Переменная окружения TG_CHAT_ID важнее.
telegram.chat-id=

# --- Время ---
# Часовой пояс, в котором заданы все времена ниже
timezone=Europe/Moscow
# Напоминание закрыть задачи (рабочие дни спринта, кроме первого)
reminder.time=16:30
# Предупреждение «задачи не закрываем» (первый рабочий день спринта)
sprint-start.time=10:00
# Во сколько откреплять сообщения
unpin.time=23:59

# --- Спринты ---
# Первый день (среда) любого спринта; спринты идут друг за другом
sprint.anchor=2026-10-07
# Длина спринта в днях
sprint.length-days=14

# --- Встречи ---
# Напоминание приходит за remind-before минут до встречи, не закрепляется
# и удаляется из чата через delete-after минут.
# Чтобы отключить встречу, оставьте её room пустым.
meeting.team=СУБО2_1-STRLPL
meeting.remind-before-minutes=5
meeting.delete-after-minutes=5
# Планирование — первый рабочий день спринта
meeting.planning.time=10:00
meeting.planning.room=https://dion.vc/event/mestnikovat
# Дейлик — все рабочие дни, кроме первого и последнего дня спринта
meeting.daily.time=10:00
meeting.daily.room=https://dion.vc/event/mestnikovat
# Обзор спринта — последний рабочий день спринта
meeting.review.time=10:00
meeting.review.room=https://dion.vc/event/ptohov

# --- Прочее ---
# Кому писать, если задачу закрыли в первый день спринта
scrum-master=@vsugonyaev
# На сколько минут закреплять сообщение по команде /test
test.pin-minutes=5
